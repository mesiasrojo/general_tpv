[package]
name = "tpv-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tpv-application = { path = "../../../crates/tpv-application" }
tpv-domain = { path = "../../../crates/tpv-domain" }
tpv-print = { path = "../../../crates/tpv-print" }
tpv-storage-sqlite = { path = "../../../crates/tpv-storage-sqlite" }
uuid = { version = "1", features = ["v7", "serde"] }
