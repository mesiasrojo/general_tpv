[workspace]
resolver = "2"
members = [
    "crates/tpv-domain",
    "crates/tpv-application",
    "crates/tpv-storage-sqlite",
    "crates/tpv-sync",
    "crates/tpv-server",
    "crates/tpv-print",
    "crates/tpv-auth",
    "apps/cli",
]
default-members = [
    "crates/tpv-domain",
    "crates/tpv-application",
    "crates/tpv-storage-sqlite",
    "crates/tpv-sync",
    "crates/tpv-server",
    "crates/tpv-print",
    "crates/tpv-auth",
    "apps/cli",
]
exclude = ["apps/desktop", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "time", "uuid", "json", "rust_decimal", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
