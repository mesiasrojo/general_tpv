services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tpv
      POSTGRES_USER: tpv
      POSTGRES_PASSWORD: tpv
    ports:
      - "55432:5432"
    volumes:
      - tpv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpv -d tpv"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tpv_pgdata:
